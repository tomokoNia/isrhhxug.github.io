<section class="wrap page page-home">
  <div class="hero panel">
    <div class="panel-body hero-body">
      <p class="eyebrow">Welcome</p>
      <h1 class="hero-title">{{siteTitle}}</h1>
      {{{tagline}}}
      {{{description}}}
      <p class="hero-meta">{{postCount}} 篇文章 · 最近更新 {{lastUpdated}}</p>
    </div>
  </div>

  {{{pinned}}}

  <div class="section-head">
    <h2 class="section-title">{{listTitle}}</h2>
    <span class="section-note">{{listNote}}</span>
  </div>

  <div class="post-list">
    {{{list}}}
  </div>

  {{{pagination}}}
</section>
